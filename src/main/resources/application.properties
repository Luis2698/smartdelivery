# Puerto del Servidor
server.port=8082

# Configuracion de HTTP UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Configuracion de Base de Datos PostgreSQL con UTF-8
spring.datasource.url=jdbc:postgresql://localhost:5432/smartdelivery_db?charSet=UTF-8
spring.datasource.username=postgres
spring.datasource.password=Luisguzman2025#
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.application.name=smartdelivery